  description: >-
    Witchsight allows the caster to see active magic, enchanted items and
    invisible entities (although such things are simply shadowy
    representations) that lie within range and line of sight. It can also
    penetrate illusions or discern the true guise of shapeshifted
    creatures. Beings which wish to remain hidden or disguised must win an
    Opposed Roll of their Willpower versus the casting roll.
