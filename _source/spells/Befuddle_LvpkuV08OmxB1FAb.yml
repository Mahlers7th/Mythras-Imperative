name: Befuddle
type: spell
img: icons/svg/item-bag.svg
system:
  traits:
    - ranged
    - resist
  resistSkill: willpower
  duration: ''
  description: >-
    Befuddle causes confusion within the mind of a corporeal target. The
    subject of the spell has difficulty thinking straight, forgetting
    where it is, what it is doing and why — often lapsing into
    disassociated lines of thought. Befuddled targets can still act in
    self defence, but cannot initiate any constructive activity until the
    spell ends. Any sort of attack or threatening action instantly breaks
    the spell, whether or not it was directed specifically at the
    befuddled target.
