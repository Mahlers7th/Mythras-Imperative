  resistSkill: ''
  duration: ''
  description: >-
    Ignite only works on flammable inorganic matter, causing a small
    object or hand-sized area to burst into flame. Depending on what was
    set alight, once burning, the flames may then spread unless quenched
    or countered in some way. This spell is normally used to light
    candles, torches or lanterns from afar. It can also be used to start a
    camp or cooking fire in adverse conditions, such as using damp
    kindling or in strong winds.
