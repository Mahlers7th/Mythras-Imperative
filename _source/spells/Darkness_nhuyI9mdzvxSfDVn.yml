  description: >-
    Darkness creates an area of shadow, equal to POW in square metres,
    which suppresses all light within it. This is enough volume to fill a
    modest room, a length of corridor or form a small cloud if cast
    outside. All non-magical light, including sunlight, passing into or
    present within the boundary is reduced to the equivalent of a dim
    glow.
