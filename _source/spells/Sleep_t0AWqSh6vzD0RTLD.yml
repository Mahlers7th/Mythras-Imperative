  resistSkill: endurance
  duration: ''
  description: >-
    Sleep sends its recipient into a deep, peaceful sleep. It has no
    effect on creatures with a SIZ greater than the caster's POW. Unless
    the target resists, it slumbers for a number of hours equal to the
    half the caster's POW. However the spell takes 1d3 Rounds to take
    effect before the target falls unconscious. Any attempt to cast this
    spell in a combat situation automatically fails.
