  resistSkill: ''
  duration: ''
  description: >-
    Heal has several different effects depending on the nature of the
    ailment it is being used on. If the subject is suffering from a minor
    complaint such as a headache, back pain, hangover, cold, warts and so
    on, then the symptoms are immediately lifted. Cast on a location
    suffering a Minor Wound it restores all lost Hit Points instantly.
    Against Serious or Major Wounds no Hit Points are recovered. However
    the spell will stabilise locations, stop all bleeding and prevent
    imminent death from inattention.
