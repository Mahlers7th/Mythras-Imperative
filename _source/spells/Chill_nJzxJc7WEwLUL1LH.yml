  description: >-
    Chill dramatically reduces the temperature of small objects (no larger
    than the caster's hand) down to the temperature of ice water. Useful
    for rapidly cooling hot items, chilling drinks, and so forth. The
    spell does not freeze an object and neither does it cause any damage
    to its structure: it merely renders it very cold.
