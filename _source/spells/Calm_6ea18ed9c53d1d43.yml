name: Calm
type: spell
img: icons/svg/item-bag.svg
system:
  traits:
    - ranged
    - resist
  resistSkill: willpower
  duration: ''
  description: >-
    Calm attempts to dampen down the passions of the target, perhaps
    ensuring that a lovesick paramour doesn't press his suit, a frightened
    rival doesn't scream for help or that weapons are not drawn in anger. A
    calmed person is not otherwise mentally affected, thus any sort of
    assault or threatening action still permits the target to defend
    themselves and even attack, albeit they will do so in a calm and level
    headed manner.
